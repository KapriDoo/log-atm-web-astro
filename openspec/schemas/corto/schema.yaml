name: corto
version: 1
description: Camino corto de simba - tareas y un delta de spec opcional
artifacts:
  - id: specs
    generates: "specs/**/*.md"
    description: Delta de spec, solo si el cambio vuelve falso un requirement especificado
    template: spec.md
    requires: []
  - id: tasks
    generates: tasks.md
    description: Checklist de implementación, escrita por el motor desde el pedido
    template: tasks.md
    requires: []

apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Implementa las tareas pendientes de tasks.md con su test, y márcalas con `- [x]` a medida que
    las cierras.

    Escribe un delta de spec solo si el cambio vuelve falso un requirement de `openspec/specs/`
    (por ejemplo, el que fija un límite de 30 que el pedido sube a 50): la spec tiene que seguir
    diciendo lo que hace el código. Un comportamiento que ningún requirement describe no lleva
    delta, aunque sea nuevo o su capability ya exista: especificarlo es trabajo del camino full.

    El delta va en el directorio del cambio, en `specs/<capability>/spec.md`, con la ruta exacta de
    la capability y sin `## Purpose`. Sus encabezados `##` van en inglés:
    - `## MODIFIED Requirements` para el requirement que cambia: copia su bloque completo desde la
      spec principal y edítalo, con cada escenario que ya tiene bajo su nombre exacto (OpenSpec
      rechaza el bloque que pierde uno). Su texto, en SHALL o MUST, no pasa de 500 caracteres, y lleva al
      menos un escenario `#### Scenario: <nombre>` (cuatro `#` exactos) con viñetas
      `- **WHEN** ...` y `- **THEN** ...`.
    - `## REMOVED Requirements` para el que se retira, con **Reason** y **Migration**.

    No toques `.openspec.yaml`: el motor declara `skip_specs` según haya o no deltas.
